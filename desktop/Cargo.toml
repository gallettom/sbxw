[package]
name = "sbxw-desktop"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
default-run = "sbxw-desktop"

# Its own workspace: the root workspace lists its members explicitly and never
# builds this directory; this table stops cargo here from climbing up to it.
[workspace]

[dependencies]
# Rune, pinned to one rev of its `dev` branch (never rewritten). Pre-release, git only.
# `tooling` keeps the headless flags (--snap, --tree, --script) in release builds too.
rune = { git = "https://github.com/anomalyco/rune", rev = "09ab92a5c83b906adb6fbf92637323b49e86d7ac", features = ["tooling"] }
alacritty_terminal = "=0.26.0"
mlua = { version = "=0.12.2", features = ["luau"] }
tungstenite = "=0.30.0"
ureq = { version = "2", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
# The stand-in daemon only (src/bin/standin.rs).
portable-pty = "0.8"

[profile.release]
opt-level = 3
strip = true

# Rune patches these four crates in its own workspace; a dependency's [patch]
# does not reach the app, so the app repeats it from the same rev
# (crates/rune/README.md, "Depending on Rune").
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "09ab92a5c83b906adb6fbf92637323b49e86d7ac" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "09ab92a5c83b906adb6fbf92637323b49e86d7ac" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "09ab92a5c83b906adb6fbf92637323b49e86d7ac" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "09ab92a5c83b906adb6fbf92637323b49e86d7ac" }
