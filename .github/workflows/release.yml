name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

# Nothing by default: each job asks for what it needs, and only the job that
# publishes the release can write to the repository.
permissions: {}

# Third-party actions are pinned to full commit SHAs (the version in the
# trailing comment), so a moved tag cannot change what runs here.

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS Apple Silicon (native) ──────────────────────────────────
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sbxw-macos-arm64
            # The voice concierge: sherpa-onnx's prebuilt universal2 libraries.
            features: --features voice

          # ── macOS Intel (cross-arch on arm64 runner; Clang handles this) ──
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: sbxw-macos-x86_64
            # The voice concierge: sherpa-onnx's prebuilt universal2 libraries.
            features: --features voice

          # ── Linux x86_64 (native) ─────────────────────────────────────────
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: sbxw-linux-x86_64

          # ── Linux arm64 (cross via `cross` + Docker) ──────────────────────
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: sbxw-linux-arm64
            use_cross: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # dtolnay/rust-toolchain has no version tags: this is the head of its
      # `stable` branch, which installs the stable toolchain.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      # Cache Cargo registry + build artefacts to speed up subsequent runs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cross@0.2.5

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --locked --release --target ${{ matrix.target }}
          else
            cargo build --locked --release --target ${{ matrix.target }} ${{ matrix.features }}
          fi

      - name: Collect binary
        run: cp target/${{ matrix.target }}/release/sbxw ${{ matrix.artifact }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ── Build the macOS menu-bar companion app (sbxw Island) ──────────────────
  island:
    name: SbxwIsland-macos
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The island carries its own version (ISLAND_VERSION in build-app.sh), not
      # the release tag — it ships on the CLI's release train but versions apart.
      - name: Build .app bundle
        run: macos/build-app.sh dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SbxwIsland-macos
          path: |
            dist/SbxwIsland-macos.zip
            dist/island-version.txt

  # ── Create GitHub Release and attach all binaries ─────────────────────────
  release:
    name: GitHub Release
    needs: [build, island]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that may: it creates the release
    steps:
      # The web UI and the bundled kits are embedded in the binary: only the
      # binaries and the island ship.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      # One line per file that install.sh and `sbxw update` download, named
      # explicitly: both refuse to install a file with no line here, so a
      # missing artifact must fail the release rather than ship unverifiable.
      - name: Generate checksums
        run: |
          set -eu
          sha256sum \
            sbxw-macos-arm64 sbxw-macos-x86_64 \
            sbxw-linux-x86_64 sbxw-linux-arm64 \
            SbxwIsland-macos.zip > sha256sums.txt
          cat sha256sums.txt

      # Signs sha256sums.txt with the RELEASE_SIGNING_KEY secret (an
      # unencrypted Ed25519 key in OpenSSH format; see docs/cli.md#release-signatures), so
      # installers that carry the public key can tell a real release from one
      # replaced by someone without the key. No secret: no signature, and the
      # release still publishes. The key only ever exists in a 0600 file in
      # the runner's temp directory, removed when the step ends.
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::notice title=Release not signed::RELEASE_SIGNING_KEY is not set, so no sha256sums.txt.sig was made. See docs/cli.md#release-signatures."
            exit 0
          fi
          umask 077
          key="$(mktemp "${RUNNER_TEMP}/release-key.XXXXXX")"
          trap 'rm -f "$key" "${key}.signers"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          ssh-keygen -q -Y sign -f "$key" -n sbxw-release sha256sums.txt
          # Check the signature the way install.sh and `sbxw update` will,
          # and print the public key (public) to compare with RELEASE_PUBLIC_KEY.
          pub="$(ssh-keygen -y -f "$key")"
          rm -f "$key"
          echo "Signed with: $pub"
          printf 'sbxw-release %s\n' "$(printf '%s' "$pub" | cut -d' ' -f1,2)" > "${key}.signers"
          ssh-keygen -Y verify -f "${key}.signers" -I sbxw-release -n sbxw-release \
            -s sha256sums.txt.sig < sha256sums.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            sbxw-macos-*
            sbxw-linux-*
            SbxwIsland-macos.zip
            island-version.txt
            sha256sums.txt
            sha256sums.txt.sig
          generate_release_notes: true
