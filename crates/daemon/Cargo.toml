[package]
name = "sbxw-daemon"
description = "The sbxw daemon: store, provisioning, PTY sessions, services and its two HTTP listeners."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sbxw-core.workspace = true
sbxw-sbx.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
axum.workspace = true
futures-util.workspace = true
portable-pty.workspace = true
async-trait.workspace = true
sha2.workspace = true

# sherpa-onnx, linked statically. macOS: its prebuilt universal2 libraries.
# Linux: its prebuilt "static" archives hold no libraries (only tools), so it
# is built from the sources the crate ships — cmake and a C++ toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static"], optional = true }
[target.'cfg(not(target_os = "macos"))'.dependencies]
sherpa-rs = { version = "0.6.8", default-features = false, features = ["static"], optional = true }

[features]
# The voice concierge's speech recognition: sherpa-onnx (built with cmake).
# Release builds enable it; plain `cargo build` stays fast without.
voice = ["dep:sherpa-rs"]

[dev-dependencies]
tempfile.workspace = true
serde_norway.workspace = true
tower.workspace = true
