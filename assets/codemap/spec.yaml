# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: codemap
description: >
  Ships /codemap, /codemap-lens, a format reference, an offline checker, and
  three Claude Code hooks that do what prose alone never did: the map's index is
  injected at session start, recalled on the session's first search, and offered
  — never written unasked — when a session ends in a repository it just read and
  could not map. So a sandbox agent reads a repository's map before its source,
  knows how to write one when there is none, and can retell it for a reader who
  does not read code. Format is lat.md's (wiki links, code links, @lat: back
  references); the picture of the whole is an Archify architecture diagram drawn
  from the same reading and checked against the same tree, using the archify
  that the agent-skills kit installs.
  Idempotent: safe to re-run on every container start.

# Nothing here reaches the network — the kit only writes files into the sandbox,
# and the archify it draws with is fetched by the agent-skills kit. The domains
# stay declared for repositories that already keep a real lat.md/ vault and run
# its CLI through npx.

# Everything the kit ships is image content: files/ is copied into the
# agent's home at build, owned by the agent. sbx builds this directory when
# the sandbox is created and caches the result while files/ is unchanged.
build: |
  FROM scratch
  COPY --chown=1000:1000 files/home/agent/ /home/agent/

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - registry.npmjs.org
          - "*.npmjs.org"
  - type: com.docker.sandbox/lifecycle@1
    config:
      # Every boot, alongside the agent: each script is idempotent.
      startup:
        - command: ["node", "/home/agent/.sbxw/codemap/install-memory.mjs"]
        - command: ["node", "/home/agent/.sbxw/codemap/install-hooks.mjs"]
