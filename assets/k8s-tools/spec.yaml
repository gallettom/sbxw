schemaVersion: "2"
kind: mixin
name: k8s-dev-tools
description: Installs k3d, kubectl and skaffold into ~/.local/bin (idempotent, arch-aware).
permissions:
  network:
    allow:
      - dl.k8s.io
      - storage.googleapis.com
      - get.k3d.io
setup:
  files:
    - path: /home/agent/.local/bin/sbxw-install-k8s
      mode: "0755"
      content: |
        #!/usr/bin/env bash
        # Idempotent, and never fails the container start: a failed install is
        # reported and skipped. The three tools are independent downloads, so
        # they run side by side; each lands in a temp file and is moved into
        # place only once complete, so a failed download leaves nothing behind.
        set -uo pipefail
        info() { echo "  [k8s-tools] $*"; }

        case "$(uname -m)" in
          x86_64)        ARCH=amd64 ;;
          aarch64|arm64) ARCH=arm64 ;;
          armv7l)        ARCH=arm   ;;
          *)             info "unsupported arch $(uname -m) — skipping"; exit 0 ;;
        esac
        info "arch: $(uname -m) -> $ARCH"

        BIN="$HOME/.local/bin"
        mkdir -p "$BIN"
        export PATH="$BIN:$PATH"

        # fetch_bin NAME URL — download one binary into $BIN.
        fetch_bin() {
          if curl -fsSLo "$BIN/.$1.part" "$2" && chmod +x "$BIN/.$1.part" && mv "$BIN/.$1.part" "$BIN/$1"; then
            info "$1 -> $BIN/$1"
          else
            rm -f "$BIN/.$1.part"
            info "$1 download failed — skipped (check network_allow)"
          fi
        }

        install_kubectl() {
          info "installing kubectl (linux/$ARCH)..."
          K8S_VER=$(curl -fsSL https://dl.k8s.io/release/stable.txt) \
            || { info "could not read the kubectl stable version — skipped"; return 0; }
          fetch_bin kubectl "https://dl.k8s.io/release/$K8S_VER/bin/linux/$ARCH/kubectl"
        }
        install_k3d() {
          info "installing k3d..."
          if curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
              | USE_SUDO=false K3D_INSTALL_DIR="$BIN" bash >/dev/null; then
            info "k3d -> $BIN/k3d"
          else
            info "k3d install failed — skipped (check network_allow)"
          fi
        }
        install_skaffold() {
          info "installing skaffold (linux-$ARCH)..."
          fetch_bin skaffold "https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-$ARCH"
        }

        for tool in kubectl k3d skaffold; do
          if command -v "$tool" >/dev/null 2>&1; then
            info "$tool already installed"
          else
            "install_$tool" &
          fi
        done
        wait

        for RC in "$HOME/.bashrc" "$HOME/.profile"; do
          [ -f "$RC" ] || continue
          grep -qF '.local/bin' "$RC" || \
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$RC"
        done
        info "done."
  startup:
    - command: ["bash", "/home/agent/.local/bin/sbxw-install-k8s"]
