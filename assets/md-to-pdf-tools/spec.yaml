# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: md-to-pdf-tools
description: >
  Ships the /md-to-pdf skill itself (as a user-level Claude Code command) and
  pre-installs the WeasyPrint + poppler-utils + Pillow stack it needs, so
  Markdown -> PDF/PNG conversion is available and works instantly with no
  first-run install step (idempotent, safe to re-run on every container start).

# apt needs the Debian/Ubuntu mirrors; pip needs PyPI. pypi.org and
# *.pythonhosted.org are already in sbxw's default network_allow, but the apt
# mirrors are not — add them to sbxw.toml's network_allow (see this kit's
# README) or the apt-get step will 403.

# Everything the kit ships is image content: files/ is copied into the
# agent's home at build, owned by the agent. sbx builds this directory when
# the sandbox is created and caches the result while files/ is unchanged.
build: |
  FROM scratch
  COPY --chown=1000:1000 files/home/agent/ /home/agent/

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - deb.debian.org
          - security.debian.org
          - archive.ubuntu.com
          - security.ubuntu.com
          - ports.ubuntu.com
          - pypi.org
          - files.pythonhosted.org
  - type: com.docker.sandbox/lifecycle@1
    config:
      # Every boot, alongside the agent: each script is idempotent.
      startup:
        - command: ["bash", "/home/agent/.local/bin/sbxw-install-md-to-pdf"]
