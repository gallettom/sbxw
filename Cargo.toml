[workspace]
resolver = "2"
members = ["crates/core", "crates/sbx", "crates/daemon", "crates/cli"]

[workspace.package]
version = "2.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/gallettom/sbxw"

[workspace.dependencies]
sbxw-core = { path = "crates/core" }
sbxw-sbx = { path = "crates/sbx" }
sbxw-daemon = { path = "crates/daemon" }

anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "process", "time", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
portable-pty = "0.8"
getrandom = "0.2"
async-trait = "0.1"
ureq = { version = "2", default-features = false, features = ["json"] }
tempfile = "3"

[profile.release]
lto = true
strip = true
opt-level = "z"
